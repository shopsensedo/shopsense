services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shopsense-db
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
      POSTGRES_DB: shopsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
